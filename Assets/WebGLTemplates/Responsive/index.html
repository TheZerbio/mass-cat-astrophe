<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The canvas always fills the page (or the itch.io iframe), whatever size that is.
         Unity then renders at that size and the Canvas Scalers scale the UI to fit. */
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden;
                   background: {{{ BACKGROUND_COLOR }}}; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none;
                      background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                 width: 40%; max-width: 400px; height: 14px; border-radius: 7px;
                 background: rgba(255, 255, 255, 0.25); overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #ffffff; transition: width 0.2s; }
      #warning { position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
                 font-family: sans-serif; font-size: 14px; display: none; }
      #warning div { padding: 6px 12px; margin-bottom: 4px; border-radius: 4px; background: #ffd27a; color: #000; }
      #warning div.error { background: #ff6b6b; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-fill"></div></div>
    <div id="warning"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warning = document.querySelector("#warning");

      // Unity calls this for warnings and errors (e.g. missing WebGL support)
      function showBanner(message, type) {
        var div = document.createElement("div");
        div.textContent = message;
        if (type === "error") div.className = "error";
        warning.appendChild(div);
        warning.style.display = "block";
        if (type !== "error") setTimeout(function () {
          warning.removeChild(div);
          if (!warning.children.length) warning.style.display = "none";
        }, 5000);
      }

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      }, function (progress) {
        document.querySelector("#loading-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus(); // so keyboard input reaches the game without an extra click
      }).catch(function (message) {
        showBanner(message, "error");
      });
    </script>
  </body>
</html>
