<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- without this, phones render the page zoomed out at desktop width -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>CATastrophe - Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* same look as register_players.html */
        :root {
            --bg: #ffffff;
            --card: #f5f5f5;
            --text: #1a1a1a;
            --muted: #666;
            --border: #c8c8c8;
            --error: #c62828;
            --you: #fff7d6;                /* highlight of the own row */
        }
        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: max(16px, env(safe-area-inset-top)) 16px 24px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #e2e2e2;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 8px 0 0;
            font-size: 28px;
            text-align: center;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        /* the big numbers at the top: rank, agreement, score */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .summary .value {
            font-size: 26px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .summary .label {
            font-size: 13px;
            color: var(--muted);
        }

        .chart_box {
            position: relative;
            height: 220px;                 /* Chart.js fills its parent, so the parent sets the size */
        }

        /* leaderboard rows */
        ol {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        li {
            display: grid;
            grid-template-columns: 2.2em 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #ffffff;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
        }
        li.you {
            background: var(--you);
            border-color: #e6d58a;
            font-weight: 600;
        }
        .rank {
            font-weight: 700;
            color: var(--muted);
            text-align: center;
        }
        li:nth-child(1) .rank { color: #b8860b; } /* gold   */
        li:nth-child(2) .rank { color: #8a8a8a; } /* silver */
        li:nth-child(3) .rank { color: #a0522d; } /* bronze */
        .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tag {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            margin-left: 4px;
        }
        .numbers {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .numbers .score {
            font-size: 18px;
            font-weight: 700;
        }
        .numbers .unit {
            font-size: 13px;
            color: var(--muted);
            font-weight: 400;
        }
        .numbers .agreement {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 400;
        }

        .message {
            margin: 0;
            color: var(--muted);
            text-align: center;
        }
        .message.error { color: var(--error); }
    </style>
</head>
<body>
    <h1>Game over!</h1>

    <section class="card" id="you_card" hidden>
        <div class="summary">
            <div><div class="value" id="your_rank">-</div><div class="label">your rank</div></div>
            <div><div class="value" id="your_agreement">-</div><div class="label">agreement</div></div>
            <div><div class="value" id="your_score">-</div><div class="label">score</div></div>
        </div>
    </section>

    <section class="card">
        <h2>Agreement with the group</h2>
        <div class="chart_box"><canvas id="similarity_chart"></canvas></div>
        <p class="message" id="chart_message" hidden></p>
    </section>

    <section class="card">
        <h2>Leaderboard</h2>
        <ol id="leaderboard"></ol>
        <p class="message" id="leaderboard_message">loading…</p>
    </section>

    <script>
        const url_params = new URLSearchParams(window.location.search);
        const game_id = url_params.get('game_id');
        const player_id = Number(url_params.get('player_id')); // NaN if missing -> nobody is highlighted

        // average of an array, null if it's empty
        function average(values) {
            if (!values || values.length === 0) return null;
            return values.reduce((sum, v) => sum + v, 0) / values.length;
        }
        function as_percent(value) {
            return value === null ? "-" : Math.round(value * 100) + "%";
        }

        function show_message(id, text, is_error = false) {
            const element = document.getElementById(id);
            element.textContent = text;
            element.classList.toggle("error", is_error);
            element.hidden = false;
        }

        async function load_statistics() {
            let json;
            try {
                const response = await fetch(`/game/${game_id}/statistics`);
                if (!response.ok) throw new Error(`server answered ${response.status}`);
                json = await response.json();
            } catch (error) {
                show_message("leaderboard_message", "Could not load the statistics.", true);
                show_message("chart_message", String(error), true);
                document.querySelector(".chart_box").hidden = true;
                return;
            }

            // the server sends the players in id order, so the index is the player id
            const players = json.players.map((player, id) => ({
                ...player,
                id,
                agreement: average(player.similarities_agg),
            }));
            const ranking = [...players].sort((a, b) => b.score - a.score);

            render_leaderboard(ranking);
            render_you(ranking);
            render_chart(players);
        }

        function render_leaderboard(ranking) {
            const list = document.getElementById("leaderboard");
            const message = document.getElementById("leaderboard_message");
            if (ranking.length === 0) {
                show_message("leaderboard_message", "No players in this game.");
                return;
            }
            message.hidden = true;

            list.replaceChildren(...ranking.map((player, index) => {
                const row = document.createElement("li");
                if (player.id === player_id) row.classList.add("you");

                const rank = document.createElement("span");
                rank.className = "rank";
                rank.textContent = index + 1;

                const name = document.createElement("span");
                name.className = "name";
                name.textContent = player.name;             // textContent: names come from users, no HTML injection
                if (player.id === player_id) name.append(tag("you"));
                if (player.is_master) name.append(tag("master"));

                const numbers = document.createElement("span");
                numbers.className = "numbers";
                const score = document.createElement("span");
                score.className = "score";
                score.textContent = player.score.toFixed(1);
                const unit = document.createElement("span");
                unit.className = "unit";
                unit.textContent = " pts";
                numbers.append(score, unit);
                const agreement = document.createElement("span");
                agreement.className = "agreement";
                agreement.textContent = as_percent(player.agreement) + " agreement";
                numbers.append(agreement);

                row.append(rank, name, numbers);
                return row;
            }));
        }
        function tag(text) {
            const element = document.createElement("span");
            element.className = "tag";
            element.textContent = `(${text})`;
            return element;
        }

        function render_you(ranking) {
            const index = ranking.findIndex(p => p.id === player_id);
            if (index < 0) return;                          // opened without (valid) player_id
            const you = ranking[index];
            document.getElementById("your_rank").textContent = `#${index + 1}`;
            document.getElementById("your_agreement").textContent = as_percent(you.agreement);
            document.getElementById("your_score").textContent = you.score.toFixed(1);
            document.getElementById("you_card").hidden = false;
        }

        function render_chart(players) {
            const longest = Math.max(0, ...players.map(p => p.similarities_agg.length));
            if (longest === 0) {
                document.querySelector(".chart_box").hidden = true;
                show_message("chart_message", "No inputs were recorded in this game.");
                return;
            }

            // own line dark and in front, everybody else light grey in the background
            const datasets = players.map(player => {
                const is_you = player.id === player_id;
                return {
                    label: is_you ? `${player.name} (you)` : player.name,
                    data: player.similarities_agg,
                    borderColor: is_you ? "#1a1a1a" : "rgba(120, 120, 120, 0.45)",
                    backgroundColor: is_you ? "rgba(26, 26, 26, 0.08)" : "transparent",
                    borderWidth: is_you ? 3 : 1.5,
                    fill: is_you,
                    tension: 0.3,                           // slightly smoothed lines
                    order: is_you ? 0 : 1,                  // lower order is drawn on top
                };
            });

            new Chart(document.getElementById("similarity_chart"), {
                type: "line",
                data: {
                    labels: Array.from({ length: longest }, (_, i) => `${i + 1}s`), // one value per second
                    datasets,
                },
                options: {
                    maintainAspectRatio: false,             // use the height of .chart_box
                    interaction: { mode: "index", intersect: false },
                    elements: { point: { radius: 0 } },
                    scales: {
                        y: {
                            min: 0,
                            max: 1,
                            ticks: { callback: value => Math.round(value * 100) + "%" },
                            grid: { color: "#e2e2e2" },
                        },
                        x: {
                            ticks: { maxTicksLimit: 8, color: "#666" },
                            grid: { display: false },
                        },
                    },
                    plugins: {
                        legend: { display: players.length <= 6, labels: { boxWidth: 12, color: "#1a1a1a" } },
                        tooltip: {
                            callbacks: { label: item => `${item.dataset.label}: ${as_percent(item.parsed.y)}` },
                        },
                    },
                },
            });
        }

        load_statistics();
    </script>
</body>
</html>
