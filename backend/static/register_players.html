<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CATastrophe<</title>
</head>
<body>
    <form id="register_name">
        <p>Display-name:</p>
        <label for="display_name"></label><input type="text" name="display_name" id="display_name"/>
        <button type="submit">Join Game</button>
        <p id="error_text" onclick="submit()"></p>
    </form>
    <script>
        function join_game(name){

            const params = new URLSearchParams(window.location.search);
            let game_id = params.get('game_id');

            let result = fetch(`/game/${game_id}/join/${name}`, {method: 'POST'})
                .then(async response => {
                    if (response.status === 200)
                        window.location.href = `/game/play?game_id=${game_id}&player_id=${await response.json()}`;
                    else
                        window.document.getElementById("error_text").textContent = await response.text();
                });
        }
        document.getElementById("register_name").addEventListener("submit", async event=>{
            event.preventDefault();
            join_game(window.document.getElementById("display_name").value);
        });
    </script>
</body>
</html>
